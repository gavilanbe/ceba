<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CEBA — El mundo de siete capas</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
  #wrap { position: absolute; inset: 0; display: grid; place-items: center; }
  #box { position: relative; aspect-ratio: 16 / 9; width: min(100vw, 177.78vh); }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
</style>
<div id="wrap"><div id="box"><canvas id="gl"></canvas><canvas id="ui" width="320" height="180"></canvas></div></div>
<script>
  // el lienzo se amplía un número entero de veces en píxeles reales: todos los píxeles miden lo mismo
  function fit() {
    const dpr = window.devicePixelRatio || 1, k = Math.max(1, Math.floor(Math.min(innerWidth * dpr / 640, innerHeight * dpr / 360)));
    const b = document.getElementById('box'); b.style.width = (640 * k / dpr) + 'px'; b.style.height = (360 * k / dpr) + 'px'; b.style.aspectRatio = 'auto';
  }
  addEventListener('resize', fit); fit();
</script>
<script type="module" src="./src/main.js"></script>
</html>
